# County parcel layers that publish the owner of record. Each was verified with a live query on 2026-11-16.
# `source` records who hosts the layer:
#   county       published by the county itself
#   pasda        snapshot hosted by Penn State's PASDA (the layer name carries its date, YYYYMM)
#   third-party  a copy published by another organisation; check its age before relying on it
# `market_value` holds whatever value the county publishes (often an assessed value, not market value).
- {name: Bedford County, counties: [BEDFORD], source: pasda 2023-07, url: "https://mapservices.pasda.psu.edu/server/rest/services/pasda/BedfordCounty/MapServer/0",
