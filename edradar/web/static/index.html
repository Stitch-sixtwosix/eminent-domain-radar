<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eminent Tracker · Pennsylvania eminent domain leads</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28' fill='none'%3E%3Crect width='28' height='28' rx='6' fill='%23fff'/%3E%3Cpath d='M5.5 7.5 19 4.5l3.5 14.5L8 23Z' stroke='%231b2333' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M2 18.5 26 9.5' stroke='%23b4502a' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='14' cy='14' r='3' fill='%23fff' stroke='%23b4502a' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --paper: oklch(97.2% 0.006 258);     /* app background, tinted toward the ink hue */
    --surface: oklch(99.4% 0.002 258);    /* panels and table */
    --rail: oklch(96.2% 0.007 258);        /* toolbars, table head */
    --line: oklch(90% 0.01 258);
    --line-strong: oklch(80% 0.016 258);
    --ink: oklch(24% 0.03 258);
    --ink-2: oklch(42% 0.028 258);       /* secondary text, 7.9:1 on surface */
    --ink-3: oklch(52% 0.024 258);       /* tertiary text, 5.1:1 on surface */
    --active: oklch(93.4% 0.008 258);    /* selected row: a neutral fill */
    --primary: oklch(24% 0.03 258);      /* the one filled button is near-black */
    --link: oklch(40% 0.11 258);
    --hot: oklch(40% 0.13 38);           /* score 80+ : dark ink on a pale tint of the same hue */
    --hot-bg: oklch(93% 0.045 45);
    --hot-line: oklch(52% 0.15 40);      /* the alignment line: map, logo */
    --warm: oklch(40% 0.085 75);         /* score 60-79 */
    --warm-bg: oklch(94.5% 0.05 88);
    --ok: oklch(40% 0.1 155);
    --ok-bg: oklch(94.5% 0.045 155);
    --danger: oklch(40% 0.14 28);
    --danger-bg: oklch(95% 0.03 28);
    --radius: 6px;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font: 400 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); background: var(--paper);
         display: grid; grid-template-rows: auto 1fr; font-variant-numeric: tabular-nums;
         -webkit-font-smoothing: antialiased; scrollbar-color: var(--line-strong) transparent; }
  ::selection { background: var(--hot-bg); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
  a { color: var(--link); text-underline-offset: 2px; text-decoration-thickness: 1px; }
  code { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--rail); padding: 1px 5px; border-radius: 4px; }

  /* ---- top bar ---- */
  header { display: flex; align-items: center; gap: 28px; padding: 0 20px; height: 52px; background: var(--surface);
           border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .logo { width: 26px; height: 26px; flex: none; margin-right: -2px; }
  .brand b { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
  .brand span { color: var(--ink-3); font-size: 13px; }
  .stats { display: flex; gap: 22px; margin-left: auto; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .stats b { color: var(--ink); font-weight: 600; margin-right: 5px; }
  .mode { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 99px;
          padding: 2px 10px; white-space: nowrap; }
  .mode[data-live] { color: var(--danger); background: var(--danger-bg); border-color: transparent; font-weight: 500; }

  /* ---- layout ---- */
  main { display: grid; grid-template-columns: 372px 1fr; grid-template-rows: minmax(0, 46%) minmax(0, 54%); min-height: 0; }
  #sidebar { grid-row: 1 / 3; border-right: 1px solid var(--line); background: var(--surface); display: flex;
             flex-direction: column; min-height: 0; }

  /* ---- controls ---- */
  select, input[type=search], button { font: inherit; color: var(--ink); background: var(--surface);
          border: 1px solid var(--line-strong); border-radius: var(--radius); height: 32px; padding: 0 10px; min-width: 0; }
  select { padding-right: 4px; }
  input[type=search]::placeholder { color: var(--ink-3); }
  button { cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
           transition: transform 140ms var(--ease-out), background-color 140ms ease, border-color 140ms ease; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { color: var(--ink-3); cursor: not-allowed; opacity: .7; }
  button.primary { background: var(--primary); border-color: var(--primary); color: oklch(98.5% 0.004 258); }
  @media (hover: hover) and (pointer: fine) {
    button:hover:not(:disabled) { border-color: var(--ink-2); background: var(--rail); }
    button.primary:hover:not(:disabled) { background: oklch(32% 0.03 258); border-color: oklch(32% 0.03 258); }
    select:hover, input[type=search]:hover { border-color: var(--ink-3); }
    .proj:hover { background: var(--rail); }
    .proj.sel:hover { background: var(--active); }
  }
  button.sm { height: 26px; padding: 0 8px; font-size: 12.5px; }
  button svg { width: 14px; height: 14px; flex: none; }
  .filters { padding: 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
             background: var(--rail); }
  .filters input, .filters .wide { grid-column: 1 / 3; }

  /* ---- project list ---- */
  #projects { overflow-y: auto; flex: 1; }
  .count { padding: 8px 14px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--line); }
  .proj { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid;
          grid-template-columns: 38px 1fr; gap: 12px; align-items: start; }
  .proj.sel { background: var(--active); }
  .proj h3 { margin: 0 0 2px; font-size: 14px; font-weight: 500; line-height: 20px; overflow-wrap: anywhere; }
  .proj.sel h3 { font-weight: 600; }
  .meta { color: var(--ink-2); font-size: 12.5px; }
  .score { font-weight: 600; font-size: 12.5px; text-align: center; border-radius: 4px; padding: 2px 0; min-width: 34px;
           display: inline-block; flex: none; white-space: nowrap; }
  .s-hot { background: var(--hot-bg); color: var(--hot); }
  .s-warm { background: var(--warm-bg); color: var(--warm); }
  .s-cool { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }

  /* ---- map ---- */
  #map { min-height: 0; background: var(--rail); }
  .leaflet-container { font: inherit; }
  /* quiet basemap so project lines lead. The filter sits on each tile image (rendered once and kept), not on the
     pane: a filtered pane has to be redrawn whole on every frame of a zoom, which shows up as blank flashes. */
  #map:not(.aerial) img.leaflet-tile { filter: saturate(.3) contrast(.94) brightness(1.04); }
  .leaflet-tooltip { font: 500 12.5px "IBM Plex Sans", sans-serif; color: var(--ink); border: 1px solid var(--line-strong);
                     border-radius: 5px; box-shadow: 0 4px 14px oklch(24% 0.03 258 / .14); }
  .leaflet-bar a { color: var(--ink); }

  /* ---- detail / leads ---- */
  #detail { border-top: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  #detail-head { padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  #d-title { font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; flex: 1; min-width: 220px; margin: 0; text-wrap: balance; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--primary); width: 15px; height: 15px; margin: 0; }
  #summary { padding: 9px 16px; color: var(--ink-2); font-size: 13px; border-bottom: 1px solid var(--line); background: var(--rail);
             max-height: 5.4em; overflow-y: auto; white-space: pre-line; max-width: none; }
  #leads-wrap { overflow: auto; flex: 1; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th:first-child, td:first-child { padding-left: 16px; }
  th { position: sticky; top: 0; z-index: 1; background: var(--surface); font-weight: 400; font-size: 12px; color: var(--ink-2);
       white-space: nowrap; box-shadow: 0 1px 0 var(--line-strong); height: 36px; padding-top: 0; padding-bottom: 0; vertical-align: middle; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td .sub { color: var(--ink-3); font-size: 12px; margin-top: 1px; }
  td.owner { font-weight: 500; min-width: 180px; }
  td.owner .sub { font-weight: 400; }
  .dash { color: var(--ink-3); }
  .total { padding: 10px 16px; font-size: 12px; color: var(--ink-3); }
  .lookup { color: var(--ink-3); font-weight: 400; }
  td.acts { white-space: nowrap; }
  td.acts button + button { margin-left: 4px; }
  .done { color: var(--ok); background: var(--ok-bg); border-radius: 4px; padding: 2px 7px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
  .done svg { width: 13px; height: 13px; }
  td select { height: 26px; font-size: 12.5px; padding: 0 2px 0 6px; }
  .empty { padding: 36px 24px; color: var(--ink-2); text-align: center; max-width: 52ch; margin: 0 auto; }
  .skel td div { height: 12px; border-radius: 4px; background: var(--line); animation: pulse 1.1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }

  /* ---- parcel panel ---- */
  tbody tr { cursor: pointer; }
  tbody tr.sel { background: var(--active); }
  tbody tr:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  #parcel { position: fixed; top: 52px; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 1100; background: var(--surface);
            border-left: 1px solid var(--line-strong); box-shadow: -12px 0 32px oklch(24% 0.03 258 / .12); display: flex;
            flex-direction: column; transform: translateX(100%); visibility: hidden;
            transition: transform 200ms var(--ease-out), visibility 0s 200ms; }
  #parcel[data-open] { transform: none; visibility: visible; transition: transform 260ms cubic-bezier(.32, .72, 0, 1), visibility 0s; }
  .p-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .p-head h2 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; overflow-wrap: anywhere; }
  .p-head .meta { grid-column: 1; }
  .p-head button { grid-row: 1 / 3; grid-column: 2; align-self: start; width: 32px; padding: 0; justify-content: center; }
  .p-body { overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .p-sec { padding: 14px 16px 2px; }
  .p-sec h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .p-sec p { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; }
  a.btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; font-size: 12.5px; font-weight: 500; color: var(--surface);
          background: var(--primary); border-radius: var(--radius); text-decoration: none; white-space: nowrap; }
  a.btn svg { width: 14px; height: 14px; }
  .p-sec .when { font-size: 13px; margin-bottom: 10px; display: grid; gap: 2px; }
  .p-sec .when b { font-weight: 600; } .p-sec .when span { color: var(--ink-2); }
  .points { width: 100%; font-size: 13px; }
  .points td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .points td:first-child { padding-right: 12px; }
  .points .sub-total td { font-weight: 500; }
  .points .total td { font-weight: 600; border-bottom: 0; font-size: 14px; }
  .figs { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--radius); }
  .figs div { padding: 9px 12px; border-left: 1px solid var(--line); }
  .figs div:first-child { border-left: 0; }
  .figs span { display: block; font-size: 12px; color: var(--ink-2); }
  .figs b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .facts { display: grid; grid-template-columns: 132px 1fr; gap: 5px 12px; margin: 0; font-size: 13px; }
  .facts dt { color: var(--ink-2); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .plain { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .plain li { padding: 8px 0; border-top: 1px solid var(--line); }
  .plain li:first-child { border-top: 0; padding-top: 0; }
  .plain a { font-weight: 500; }
  .plain .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
  details.rec { margin: 14px 16px 0; font-size: 12.5px; }
  details.rec summary { cursor: pointer; font-weight: 500; font-size: 13px; padding: 4px 0; }
  details.rec .facts { margin-top: 6px; font-size: 12.5px; }
  .dim { background: var(--ink); color: oklch(97% 0.004 258); border: 0; border-radius: 4px; padding: 1px 5px; font: 500 11.5px "IBM Plex Sans", sans-serif;
         box-shadow: none; white-space: nowrap; }
  .dim::before { display: none; }
  .basemap { position: absolute; top: 10px; left: 54px; z-index: 500; display: flex; background: var(--surface); border: 1px solid var(--line-strong);
             border-radius: var(--radius); padding: 2px; gap: 2px; }
  .basemap button { height: 26px; padding: 0 10px; border: 0; font-size: 12.5px; background: transparent; }
  .basemap button[aria-pressed=true] { background: var(--ink); color: oklch(98.5% 0.004 258); }
  #map { position: relative; }

  /* ---- stage list ---- */
  .stages { list-style: none; margin: 0; padding: 0; display: flex; }
  .stages li { flex: 1; position: relative; padding: 16px 8px 0 0; font-size: 12.5px; color: var(--ink-3); min-width: 0; }
  .stages li::before { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 2px; background: var(--line-strong); }
  .stages li::after { content: ""; position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-radius: 50%;
                      background: var(--surface); box-shadow: inset 0 0 0 2px var(--line-strong); }
  .stages li:last-child::before { right: auto; width: 10px; }
  .stages li[data-state=done] { color: var(--ink-2); }
  .stages li[data-state=done]::before, .stages li[data-state=done]::after { background: var(--ink-2); box-shadow: none; }
  .stages li[data-state=current] { color: var(--ink); font-weight: 600; }
  .stages li[data-state=current]::after { background: var(--hot-line); box-shadow: 0 0 0 3px var(--hot-bg); }
  .stages.col { flex-direction: column; }
  .stages.col li { padding: 0 0 12px 22px; }
  .stages.col li::before { top: 4px; bottom: -4px; left: 4px; right: auto; width: 2px; height: auto; }
  .stages.col li::after { top: 3px; }
  .stages.col li:last-child { padding-bottom: 0; }
  .stages.col li:last-child::before { display: none; }
  .stages.col li span { display: block; font-weight: 400; color: var(--ink-2); font-size: 12.5px; }
  #stagebar { padding: 10px 16px 12px; border-bottom: 1px solid var(--line); }
  #stagebar .when { font-size: 13px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 2px 16px; align-items: baseline; }
  #stagebar .when b { font-weight: 600; }
  #stagebar .when span { color: var(--ink-2); }

  /* ---- template editor and letter ---- */
  .tpl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .tpl h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .tpl h3:not(:first-child) { margin-top: 16px; }
  .tpl .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tpl label { display: grid; gap: 3px; font-size: 12px; color: var(--ink-2); }
  .tpl label.wide { grid-column: 1 / 3; }
  .tpl input, .tpl textarea { font: inherit; font-size: 13px; color: var(--ink); padding: 6px 9px; border: 1px solid var(--line-strong);
          border-radius: var(--radius); background: var(--surface); width: 100%; min-width: 0; }
  .tpl input { height: 32px; }
  .tpl textarea { resize: vertical; line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
  .chips button { height: 24px; padding: 0 7px; font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; border-color: var(--line); }
  .letter { white-space: pre-wrap; font-size: 13px; line-height: 1.5; border: 1px solid var(--line); border-radius: var(--radius);
            padding: 12px 14px; background: var(--paper); max-height: 300px; overflow-y: auto; overflow-wrap: anywhere; }
  .letter b { font-weight: 600; }
  .row-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .flag { display: inline-block; font-size: 11.5px; font-weight: 500; border-radius: 4px; padding: 0 6px; margin-left: 6px;
          background: var(--danger-bg); color: var(--danger); white-space: nowrap; }
  .flag.ok { background: var(--ok-bg); color: var(--ok); }
  .usage { width: 100%; font-size: 13px; margin-bottom: 14px; }
  .usage caption { text-align: left; font-weight: 600; font-size: 13px; padding-bottom: 6px; }
  .usage th { position: static; box-shadow: none; height: auto; padding: 6px 12px; }
  .usage th:first-child, .usage td:first-child { padding-left: 0; }
  .contacts { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
  .contacts li { padding: 7px 0; border-top: 1px solid var(--line); }
  .contacts b { font-weight: 500; }
  dialog.wide { width: min(1040px, calc(100vw - 32px)); }
  @media (max-width: 900px) { .tpl { grid-template-columns: 1fr; } }

  /* ---- info tips ---- */
  .info { all: unset; display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 4px; border-radius: 50%;
          color: var(--ink-3); cursor: help; vertical-align: -3px; }
  .info svg { width: 14px; height: 14px; }
  .info:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  @media (hover: hover) and (pointer: fine) { .info:hover { color: var(--ink); } }
  [data-tip] { cursor: help; }
  #tip { position: fixed; z-index: 2000; max-width: 300px; padding: 9px 11px; border-radius: 6px; background: var(--ink);
         color: oklch(97% 0.004 258); font-size: 12.5px; line-height: 1.45; white-space: pre-line; pointer-events: none;
         box-shadow: 0 8px 24px oklch(24% 0.03 258 / .22); opacity: 0; transform: scale(.97);
         transition: opacity 125ms ease, transform 125ms var(--ease-out); }
  #tip[data-show] { opacity: 1; transform: scale(1); }
  #tip[data-instant] { transition-duration: 0ms; }
  #tip b { font-weight: 600; }
  #tip .row { display: flex; justify-content: space-between; gap: 16px; }
  #tip .row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #tip .sum { border-top: 1px solid oklch(100% 0 0 / .22); margin-top: 5px; padding-top: 5px; font-weight: 600; }
  #breakdown { padding: 9px 16px 10px; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
  #breakdown .lead { color: var(--ink-2); }
  #breakdown .part { white-space: nowrap; }
  #breakdown .part b { font-weight: 600; margin-left: 5px; }
  #breakdown .eq { font-weight: 600; white-space: nowrap; }

  /* ---- dialog ---- */
  dialog { border: 1px solid var(--line-strong); border-radius: 8px; padding: 0; width: min(760px, calc(100vw - 32px));
           color: var(--ink); background: var(--surface); box-shadow: 0 24px 60px oklch(24% 0.03 258 / .28);
           opacity: 0; transform: scale(.97);
           transition: opacity 150ms ease, transform 150ms var(--ease-out), overlay 150ms allow-discrete, display 150ms allow-discrete; }
  dialog[open] { opacity: 1; transform: scale(1); transition-duration: 200ms; }
  @starting-style { dialog[open] { opacity: 0; transform: scale(.97); } }
  dialog::backdrop { background: oklch(24% 0.03 258 / 0); transition: background-color 150ms ease, overlay 150ms allow-discrete, display 150ms allow-discrete; }
  dialog[open]::backdrop { background: oklch(24% 0.03 258 / .38); transition-duration: 200ms; }
  @starting-style { dialog[open]::backdrop { background: oklch(24% 0.03 258 / 0); } }
  .dlg-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .dlg-head p { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; }
  .dlg-body { padding: 16px 20px; max-height: 64vh; overflow-y: auto; }
  .dlg-foot { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--rail); display: flex; gap: 8px;
              align-items: center; border-radius: 0 0 8px 8px; }
  .dlg-foot .note { flex: 1; color: var(--ink-2); font-size: 12.5px; }
  .to { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 13px; margin: 0 0 14px; }
  .to dt { color: var(--ink-3); } .to dd { margin: 0; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card-frame { aspect-ratio: 6.25 / 4.25; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden;
                position: relative; background: #fff; box-shadow: 0 2px 8px oklch(24% 0.03 258 / .1); }
  .card-frame iframe { position: absolute; top: 0; left: 0; width: 600px; height: 408px; border: 0; transform-origin: 0 0; pointer-events: none; }

  terms.push(TYPE[p.project_type] || "condemnation", '"partial taking" OR "just compensation"');
  const query = terms.join(" ");
  return {query, results: [], why: "This search runs on CourtListener's own site.",
    search_url: "https://www.courtlistener.com/?" + new URLSearchParams({q: query, type: "o", court: "pa pacommwct pasuperct", order_by: "score desc"})};
}
function staticLeads(q) {
  const pid = q.get("project_id"), min = +(q.get("min_score") || 0), county = q.get("county"), own = q.get("owner_only"), stage = q.get("stage");
  const byId = Object.fromEntries(SNAP.projects.map(p => [p.id, p]));
  return SNAP.leads.filter(l => (!pid || l.project_id === +pid) && l.score >= min && (!stage || (byId[l.project_id] || {}).stage === stage) &&
      (!county || (l.parcel_county || "").toUpperCase() === county) && (!own || l.owner) && staticOutreach(l, q.get("outreach")))
    .map(l => { const p = byId[l.project_id] || {}; return {...l, project: p.name, project_type: p.project_type, stage: p.stage, agency: p.agency, source: p.source, url: p.url}; });
}
async function staticApi(path) {
  if (!SNAP) { const r = await fetch("data.json"); if (!r.ok) throw new Error("data.json returned " + r.status); SNAP = await r.json(); }
  const [route, qs] = path.split("?"), q = new URLSearchParams(qs || "");
  if (route === "/api/stats") return SNAP.stats;

  if (route === "/api/projects") {

    return SNAP.projects.filter(p => p.score >= min && (!q.get("county") || p.county === q.get("county")) &&
      (!q.get("project_type") || p.project_type === q.get("project_type")) &&
      (!q.get("source") || (p.source || "").startsWith(q.get("source"))) && (!q.get("stage") || p.stage === q.get("stage")) &&
      (!text || ((p.name || "") + " " + (p.summary || "")).toLowerCase().includes(text))).slice(0, 500);

}
function downloadCsv(rows) {

  const cols = Object.keys(rows[0]), cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const blob = new Blob([[cols.join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\n")], {type: "text/csv"});

function drawProject(p) {
  const g = p.geometry, color = scoreColor(p.score);
  let layer = null;
  if (g && g.paths) layer = L.polyline(g.paths.map(path => path.map(([x, y]) => [y, x])), {color, weight: 4, opacity: .9, lineCap: "round"});
  else if (g && g.points) layer = L.featureGroup(g.points.map(([x, y]) =>
      L.circleMarker([y, x], {radius: 6, color, fillColor: color, fillOpacity: .55, weight: 2})));
  if (!layer) return;
  layer.bindTooltip(p.name || "Project", {sticky: true});
  layer.on("click", () => select(p.id, false));
  layer.addTo(group);
  layers[p.id] = layer;
}

const X_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>';
function closeParcel() {
  if (!openLead) return;
  openLead = null; panel.removeAttribute("data-open"); parcelLayer.clearLayers();
  document.querySelectorAll("tbody tr.sel").forEach(tr => tr.classList.remove("sel"));
  if (!baseChosen) setBase("map");

function drawBoundary(b) {
  parcelLayer.clearLayers();
  if (!b || !b.rings) return;
  const rings = b.rings.map(r => r.map(([x, y]) => [y, x]));
  L.polygon(rings, {color: "oklch(24% 0.03 258)", weight: 6, opacity: .9, fill: false, interactive: false}).addTo(parcelLayer);
  L.polygon(rings, {color: "#fff", weight: 2.5, fillColor: "oklch(62% 0.17 40)", fillOpacity: .22, interactive: false}).addTo(parcelLayer);
  (b.sides || []).forEach(s => L.tooltip({permanent: true, direction: "center", className: "dim", interactive: false})
    .setLatLng(s.mid).setContent(s.feet.toLocaleString() + " ft").addTo(parcelLayer));
  const pad = innerWidth > 900 ? {paddingTopLeft: [40, 40], paddingBottomRight: [panel.offsetWidth - Math.max(0, innerWidth - $("map").getBoundingClientRect().right) + 40, 40]} : {padding: [30, 30]};
  map.fitBounds(L.latLngBounds(rings.flat()), {...pad, maxZoom: 19, animate: !reduceMotion, duration: 0.45});
}

    ${traceBlock(d, r, o)}

panel.addEventListener("click", async e => {
  if (e.target.closest("[data-close-parcel]")) return closeParcel();
  const find = e.target.closest("[data-find-contacts]"), copy = e.target.closest("[data-copy-letter]"), print = e.target.closest("[data-print-letter]"), act = e.target.closest("[data-act]");
  const lead = id => leadRows.find(x => x.id === +id);
  if (act) return openPostcard(+act.dataset.lead);
  if (print) return printLetter(lead(print.dataset.printLetter));
  if (copy) {
    const L_ = letterFor(lead(copy.dataset.copyLetter));
    try { await navigator.clipboard.writeText(L_.subject + "\n\n" + L_.body); copy.textContent = "Copied"; } catch (err) { copy.textContent = "Copy failed"; }
    setTimeout(() => { copy.textContent = "Copy"; }, 1600);
  }
  const tr = e.target.closest("[data-trace]");
  if (tr) {
    if (!tr.dataset.armed) { tr.dataset.armed = "1"; tr.textContent = `Confirm lookup (${usd(OUT.skiptrace.price)} if matched)`; tr.classList.add("primary"); return; }
    tr.disabled = true; tr.textContent = "Looking up…";
    try { await api(`/api/leads/${tr.dataset.trace}/skip-trace`, {method: "POST"}); await openParcel(+tr.dataset.trace); }
    catch (err) { tr.disabled = false; tr.textContent = "Try again"; tr.insertAdjacentHTML("afterend", `<span class="meta">${esc(err.message)}</span>`); }
    return;
  }
  if (find) {
    find.disabled = true; find.textContent = "Searching Apollo…";
    try { await api(`/api/leads/${find.dataset.findContacts}/email/contacts`); await openParcel(+find.dataset.findContacts); }
    catch (err) { find.disabled = false; find.textContent = "Try again"; find.insertAdjacentHTML("afterend", `<span class="meta">${esc(err.message)}</span>`); }
  }
});

/* ---- info tips: delayed for the first, instant while moving between them; open on hover, focus and tap ---- */
const tip = $("tip");
let tipTimer, tipWarm = 0, tipFor = null;
function tipContent(el) {
  if (el.dataset.tipKey) return esc(TIPS[el.dataset.tipKey] || "");
  if (el.dataset.tipText) return esc(el.dataset.tipText);
  if (el.dataset.tipProject) { const p = projects.find(x => x.id === +el.dataset.tipProject); return p ? projectTip(p) : ""; }
  if (el.dataset.tipLead) { const r = leadRows.find(x => x.id === +el.dataset.tipLead); return r ? leadTip(r) : ""; }
  return "";
}
function showTip(el, instant) {
  clearTimeout(tipTimer);
  const open = () => {
    const html = tipContent(el);
    if (!html) return;
    tip.innerHTML = html; tipFor = el;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    const left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    const below = r.bottom + 8 + h < innerHeight;
    tip.style.left = left + "px";
    tip.style.top = (below ? r.bottom + 8 : r.top - h - 8) + "px";
    tip.style.transformOrigin = `${r.left + r.width / 2 - left}px ${below ? "top" : "bottom"}`;
    tip.toggleAttribute("data-instant", Date.now() - tipWarm < 400);
    tip.setAttribute("data-show", "");
  };
  instant || Date.now() - tipWarm < 400 ? open() : (tipTimer = setTimeout(open, 250));
}
function hideTip() { clearTimeout(tipTimer); if (tip.hasAttribute("data-show")) tipWarm = Date.now(); tip.removeAttribute("data-show"); tipFor = null; }
const tipTarget = e => e.target.closest && e.target.closest("[data-tip-key],[data-tip-project],[data-tip-lead],[data-tip-text]");
document.addEventListener("mouseover", e => { const el = tipTarget(e); if (el && el !== tipFor) showTip(el); });
document.addEventListener("mouseout", e => { const el = tipTarget(e); if (el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener("focusin", e => { const el = tipTarget(e); if (el) showTip(el, true); });
document.addEventListener("focusout", hideTip);
document.addEventListener("click", e => {
  const el = e.target.closest && e.target.closest("[data-tip-key]");
  if (el) { e.stopPropagation(); tipFor === el && tip.hasAttribute("data-show") ? hideTip() : showTip(el, true); } else hideTip();
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
document.addEventListener("scroll", hideTip, true);

/* ---- events ---- */
$("projects").addEventListener("click", e => { const el = e.target.closest(".proj"); if (el) select(+el.dataset.id); });
$("projects").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest(".proj");
  if (el) { e.preventDefault(); select(+el.dataset.id, true, false); }
});
$("leads-wrap").addEventListener("change", async e => {
  const id = e.target.dataset.status;
  if (id) await api("/api/leads/" + id, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({status: e.target.value})});
});
$("leads-wrap").addEventListener("click", e => {
  const link = e.target.closest("[data-project]"), act = e.target.closest("[data-act]");
  if (link) { e.preventDefault(); select(+link.dataset.project, false); }
  if (act) (act.dataset.act === "postcard" ? openPostcard : openEmail)(+act.dataset.lead);
  const row = e.target.closest("tr[data-row]");
  if (row && !link && !act && !e.target.closest("select, button, a")) openParcel(+row.dataset.row);
});
$("leads-wrap").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("tr[data-row]")) openParcel(+e.target.dataset.row);
});
$("btn-all").addEventListener("click", () => { selected = null; markSelected(); reduceMotion ? map.fitBounds(HOME, {animate: false}) : map.flyToBounds(HOME, {duration: 0.45, easeLinearity: 0.3}); loadLeads(); });
$("btn-csv").addEventListener("click", () => {
  if (STATIC) downloadCsv(staticLeads(leadParams())); else location.href = "/api/leads.csv?" + leadParams();
});
$("f-owner").addEventListener("change", loadLeads);
$("f-outreach").addEventListener("change", loadLeads);
$("btn-campaign").addEventListener("click", openCampaign);
$("btn-template").addEventListener("click", openTemplate);
$("btn-usage").addEventListener("click", openUsage);
let timer;
for (const id of ["f-county", "f-type", "f-source", "f-stage", "f-score", "f-q"])
  $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(async () => { await loadProjects(); await loadLeads(); }, 250); });

(async () => {
  skeleton();
  const s = await api("/api/stats");
  STATUSES = s.statuses; TOTAL_LEADS = s.leads;
  if (s.updated) $("st-updated").textContent = "Data from " + day(s.updated);
  $("st-projects").textContent = s.projects.toLocaleString();
  $("st-leads").textContent = s.leads.toLocaleString();
  $("st-owners").textContent = s.leads_with_owner.toLocaleString();
  const mode = $("mode");
  if (STATIC) { mode.textContent = `Snapshot of ${s.generated || "an earlier run"}, read-only`; mode.hidden = false; }
  else {
    OUT = await api("/api/outreach/status");
    mode.textContent = "Postcards: " + ({live: "live", test: "test mode", off: "off"}[OUT.postcard.mode]) + " · Email: " + (OUT.email.enabled ? "on" : "off");
    if (OUT.postcard.mode === "live") mode.dataset.live = "";
    $("btn-campaign").hidden = false;
    $("btn-usage").hidden = false;
    mode.hidden = false;
  }
  TPL = await api("/api/outreach/template");
  $("btn-template").hidden = false;
  const title = c => c[0] + c.slice(1).toLowerCase();
  $("f-county").insertAdjacentHTML("beforeend", s.counties.map(c => `<option value="${esc(c)}">${esc(title(c))}</option>`).join(""));
  $("f-type").insertAdjacentHTML("beforeend", s.types.map(c => `<option>${esc(c)}</option>`).join(""));
  $("f-stage").insertAdjacentHTML("beforeend", (s.stages || []).map((x, i) => `<option value="${esc(x.key)}">${i + 1}. ${esc(x.label)} (${x.projects})</option>`).join(""));
  await loadProjects();
  await loadLeads();
})().catch(e => { $("leads-wrap").innerHTML = `<div class="empty">The data could not be loaded: ${esc(e.message)}. Reload the page to try again.</div>`; });
</script>
</body>
</html>
