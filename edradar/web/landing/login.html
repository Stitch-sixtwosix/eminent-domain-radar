<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · EminentTracker</title>
<meta name="description" content="Sign in to EminentTracker. Built by eminent domain attorneys, for eminent domain attorneys.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%231b2333'/%3E%3Cpath d='M8 5h16v4.200H12.200v13.600H24V27H8z' fill='%23fff'/%3E%3Cpath d='M12.200 13.900H32v4.200H12.200z' fill='%23e0662e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="auth-config.js"></script>
</head>
<body>

<header class="bar">
  <a class="brand" href="./" aria-label="EminentTracker home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7.5" fill="#1b2333"/><path d="M8 5h16v4.200H12.200v13.600H24V27H8z" fill="#fff"/><path d="M12.200 13.900H32v4.200H12.200z" fill="#e0662e"/></svg><b>Eminent<span>Tracker</span></b></a>
  <nav aria-label="Site">
    <a href="./#how">How it works</a>
    <a href="./#about">Who built it</a>
    <a href="app/">Live Pennsylvania data</a>
    <a class="auth-only" href="login.html">Sign in</a>
  </nav>
</header>

<main class="signup">
  <div class="why">
    <h1 style="font-size: var(--s-title)">Sign in</h1>
    <p>Built by eminent domain attorneys, for eminent domain attorneys.</p>
    <p style="font-size: var(--s-small); margin-top: 28px">New here? <a href="signup.html">Create your firm's account</a></p>
  </div>
  <div>
    <form class="card narrow" id="login" novalidate>
      <p class="status auth-off" role="status">Accounts are not open yet. <a href="signup.html">Request access</a> and we will set your firm up.</p>
      <div class="auth-only gate"><button class="btn google" type="button" id="google"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.640 9.200c0-.640-.060-1.250-.160-1.840H9v3.480h4.840a4.140 4.140 0 0 1-1.800 2.720v2.260h2.920c1.700-1.570 2.680-3.880 2.680-6.620z"/><path fill="#34A853" d="M9 18c2.430 0 4.470-.800 5.960-2.180l-2.920-2.260c-.800.540-1.830.860-3.040.860-2.340 0-4.330-1.580-5.040-3.710H.960v2.330A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.960 10.710a5.400 5.400 0 0 1 0-3.420V4.960H.960a9 9 0 0 0 0 8.080l3-2.330z"/><path fill="#EA4335" d="M9 3.580c1.320 0 2.500.450 3.440 1.350l2.580-2.590A9 9 0 0 0 .960 4.960l3 2.330C4.670 5.160 6.660 3.580 9 3.580z"/></svg>Continue with Google</button><p class="or">or use your email</p></div>
      <div class="grid one auth-only">
        <label>Work email<input type="email" name="email" autocomplete="email" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <p class="status" id="status" role="alert" hidden></p>
        <div class="send"><button class="btn" type="submit" id="go">Sign in</button><button class="btn plain" type="button" id="forgot">Email me a reset link</button></div>
      </div>
    </form>
  </div>
</main>

<script type="module">
import {authOn, supa, google, here, currentUser, say, watch, valid, checkField} from "./auth.js";
const form = document.getElementById("login"), status = document.getElementById("status"), go = document.getElementById("go");
if (authOn) {
  if (await currentUser()) location.replace("account.html");
  watch(form);
  document.getElementById("google").addEventListener("click", async () => { try { await google(); } catch (e) { say(status, "Google sign-in did not start: " + e.message, true); } });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!valid(form)) return;
    go.disabled = true; say(status, "");
    const d = Object.fromEntries(new FormData(form)), s = await supa();
    const {error} = await s.auth.signInWithPassword({email: d.email, password: d.password});
    if (error) { say(status, /confirm/i.test(error.message) ? "Confirm your email first: open the link we sent you." : "That email and password do not match an account.", true); go.disabled = false; return; }
    location.href = "account.html";
  });
  document.getElementById("forgot").addEventListener("click", async () => {
    const email = form.elements.email;
    if (!checkField(email)) { email.focus(); return; }
    const s = await supa(), {error} = await s.auth.resetPasswordForEmail(email.value, {redirectTo: here("account.html")});
    say(status, error ? "The reset email could not be sent: " + error.message : "If " + email.value + " has an account, a reset link is on its way.", !!error);
  });
}
</script>
</body>
</html>
